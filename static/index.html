<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harvey</title>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --line:#262c36; --txt:#e8ecf2; --mut:#8b95a5; --acc:#4f9cff; --on:#ff5b5b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--txt); font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         display: flex; flex-direction: column; max-width: 680px; margin: 0 auto; }
  header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
  header small { color: var(--mut); display: block; font-size: 12px; font-weight: 400; }
  .tools { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--mut); }
  .tools button { background: none; border: 1px solid var(--line); color: var(--mut); border-radius: 8px; padding: 5px 9px; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #1d3556; border-color: #26456f; }
  .msg a { color: var(--acc); }
  #estado { text-align: center; color: var(--mut); font-size: 13px; min-height: 20px; padding: 2px 0; }
  #barra { display: flex; gap: 10px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); align-items: center; }
  #texto { flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--txt); border-radius: 22px; padding: 11px 16px; font-size: 16px; outline: none; }
  #texto:focus { border-color: var(--acc); }
  .btn { width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer; font-size: 20px; flex: none; }
  #enviar { background: var(--acc); color: #fff; }
  #mic { background: var(--panel); color: var(--txt); border: 1px solid var(--line); width: 56px; height: 56px; font-size: 24px; }
  #mic.on { background: var(--on); border-color: var(--on); animation: pulso 1.4s infinite; }
  @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(255,91,91,.5);} 70% { box-shadow: 0 0 0 16px rgba(255,91,91,0);} 100% { box-shadow: 0 0 0 0 rgba(255,91,91,0);} }
  @media (prefers-reduced-motion: reduce) { #mic.on { animation: none; } }
</style>
</head>
<body>
<header>
  <h1>HARVEY <small>Asistente de Corp LiteX</small></h1>
  <div class="tools">
    <label><input type="checkbox" id="vozOn" checked> Voz</label>
    <button id="borrar" title="Borrar memoria">Borrar memoria</button>
  </div>
</header>
<div id="log"></div>
<div id="estado"></div>
<div id="barra">
  <button class="btn" id="mic" title="Conversar por voz">🎤</button>
  <input id="texto" type="text" placeholder="Escriba su mensaje…" autocomplete="off">
  <button class="btn" id="enviar" title="Enviar">➤</button>
</div>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const $ = (id) => document.getElementById(id);
const log = $('log'), estado = $('estado'), mic = $('mic'), texto = $('texto'), vozOn = $('vozOn');

const K_HIST = 'harvey_hist', K_CODE = 'harvey_code';
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
const leer = (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } };

let historial = [];
try { historial = JSON.parse(leer(K_HIST) || '[]'); } catch (_) {}
let codigo = leer(K_CODE) || '';
let needsCode = false;
let activo = false, hablando = false, ocupado = false, rec = null;

// ---------- Interfaz ----------
function addMsg(rol, t, url) {
  const d = document.createElement('div');
  d.className = 'msg ' + (rol === 'user' ? 'user' : 'harvey');
  d.textContent = t;
  if (url) {
    d.appendChild(document.createElement('br'));
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Abrir en YouTube';
    d.appendChild(a);
  }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
const setEstado = (t) => { estado.textContent = t || ''; };
function actualizarMic() {
  mic.classList.toggle('on', activo);
  mic.textContent = activo ? '⏹' : '🎤';
}

// ---------- Voz de salida ----------
let vozEs = null;
function elegirVoz() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('es'));
  vozEs = vs.find(v => /es[-_](mx|us|sv|419)/i.test(v.lang)) || vs[0] || null;
}
if ('speechSynthesis' in window) { elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz; }

function limpiar(t) {
  return String(t).replace(/<think>[\s\S]*?<\/think>/g, '').replace(/[*_`#>]+/g, '').replace(/\s+/g, ' ').trim();
}

function hablar(t) {
  return new Promise((resolve) => {
    if (!vozOn.checked || !('speechSynthesis' in window)) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = (vozEs && vozEs.lang) || 'es-MX';
    if (vozEs) u.voice = vozEs;
    u.rate = 1;
    hablando = true;
    const fin = () => { hablando = false; resolve(); };
    u.onend = fin; u.onerror = fin;
    setEstado('Hablando…');
    speechSynthesis.speak(u);
  });
}

// ---------- Comandos ----------
const L = (s) => new RegExp('(?<!\\p{L})(?:' + s + ')(?!\\p{L})', 'iu');
const RE_SALIR = L('salir|apágate|apagate|adiós|adios');
const RE_MUSICA = /(?<!\p{L})(?:pon|ponme|poner|reproduce|reproducir|toca|tocar)(?!\p{L})\s*(.*)/iu;
const RE_CORREO = L('correos?|emails?');
const RE_JUEGO = /(?<!\p{L})(?:abre|abrir|inicia|iniciar|ejecuta|ejecutar|lanza|lanzar)(?!\p{L}).*(?<!\p{L})(?:juegos?)(?!\p{L})/iu;
const RE_PREFIJOS = /^(?:(?:la|una|alguna|algo|el|tema|canción|cancion|música|musica|de|del)(?!\p{L})\s*)+/iu;

function comandoMusica(resto) {
  let q = resto.replace(RE_PREFIJOS, '').replace(/[.,;\s]+$/g, '').trim();
  if (!q) q = 'lo-fi chill';
  const url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
  try { window.open(url, '_blank', 'noopener'); } catch (_) {}
  return { texto: `Sintonizando ${q} en YouTube, señor Alexander.`, url };
}

// ---------- Servidor ----------
async function pedirCodigo() {
  const c = prompt('Código de acceso:');
  if (!c) throw new Error('Se requiere el código de acceso.');
  codigo = c.trim();
  guardar(K_CODE, codigo);
}

async function preguntar(t, reintento = false) {
  const r = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Access-Code': codigo },
    body: JSON.stringify({ messages: [...historial.slice(-20), { role: 'user', text: t }] })
  });
  if (r.status === 401 && !reintento) { await pedirCodigo(); return preguntar(t, true); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Error del servidor.');
  return d.reply;
}

// ---------- Flujo principal ----------
async function procesar(t) {
  t = t.trim();
  if (!t || ocupado) return;
  ocupado = true;
  addMsg('user', t);
  try {
    if (RE_SALIR.test(t)) {
      activo = false; actualizarMic();
      const m = 'Entendido, señor Alexander. Hasta pronto.';
      addMsg('harvey', m); await hablar(m);
      return;
    }
    const mm = RE_MUSICA.exec(t);
    if (mm) {
      const { texto: m, url } = comandoMusica(mm[1]);
      addMsg('harvey', m, url); await hablar(m);
      return;
    }
    if (RE_CORREO.test(t)) {
      const m = 'Aún no tengo acceso a su correo, señor Alexander.';
      addMsg('harvey', m); await hablar(m);
      return;
    }
    if (RE_JUEGO.test(t)) {
      const m = 'Aún no tengo configurados los juegos, señor Alexander.';
      addMsg('harvey', m); await hablar(m);
      return;
    }

    setEstado('Pensando…');
    const resp = limpiar(await preguntar(t));
    addMsg('harvey', resp);
    historial.push({ role: 'user', text: t }, { role: 'assistant', text: resp });
    historial = historial.slice(-40);
    guardar(K_HIST, JSON.stringify(historial));
    await hablar(resp);
  } catch (e) {
    addMsg('harvey', '⚠️ ' + e.message);
  } finally {
    ocupado = false;
    setEstado('');
    if (activo) escuchar();
  }
}

// ---------- Micrófono ----------
function escuchar() {
  if (!SR || hablando || ocupado || !activo) return;
  rec = new SR();
  rec.lang = 'es-SV';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onstart = () => setEstado('Escuchando…');
  rec.onresult = (e) => { const t = e.results[0][0].transcript; if (t.trim()) procesar(t); };
  rec.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      activo = false; actualizarMic();
      setEstado('Permiso de micrófono denegado. Revise los permisos del sitio.');
    }
  };
  rec.onend = () => { if (activo && !hablando && !ocupado) setTimeout(escuchar, 300); };
  try { rec.start(); } catch (_) {}
}

mic.addEventListener('click', () => {
  if (!SR) { setEstado('Este navegador no admite reconocimiento de voz. Use Chrome o Edge, o escriba.'); return; }
  activo = !activo;
  actualizarMic();
  if (activo) escuchar();
  else { try { rec && rec.abort(); } catch (_) {} setEstado(''); }
});

function enviarTexto() { const t = texto.value; texto.value = ''; procesar(t); }
$('enviar').addEventListener('click', enviarTexto);
texto.addEventListener('keydown', (e) => { if (e.key === 'Enter') enviarTexto(); });

$('borrar').addEventListener('click', () => {
  if (!confirm('¿Borrar la memoria de conversaciones de este navegador?')) return;
  historial = []; guardar(K_HIST, '[]'); log.innerHTML = '';
  addMsg('harvey', 'Memoria borrada, señor Alexander.');
});

// ---------- Inicio ----------
(async () => {
  historial.slice(-20).forEach(m => addMsg(m.role, m.text));
  try {
    const s = await (await fetch('/api/status')).json();
    needsCode = !!s.needs_code;
    if (needsCode && !codigo) await pedirCodigo();
  } catch (_) {}
  addMsg('harvey', 'Sistemas en línea. Quedo a sus órdenes, señor Alexander.');
  if (!SR) setEstado('Sin reconocimiento de voz en este navegador: puede escribir sus mensajes.');
})();
</script>
</body>
</html>
